name: verify

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install online-judge-verify-helper==5.6.0 setuptools==69.5.1

    - name: Restore case-sensitive include aliases
      run: |
        if [ -f ds/sequence/BIT.hpp ] && [ ! -e ds/sequence/bit.hpp ]; then
          ln -s BIT.hpp ds/sequence/bit.hpp
        fi
        if [ -f ds/utility/Hash.hpp ] && [ ! -e ds/utility/hash.hpp ]; then
          ln -s Hash.hpp ds/utility/hash.hpp
        fi
        if [ -f ds/sequence/Mo.hpp ] && [ ! -e ds/sequence/mo.hpp ]; then
          ln -s Mo.hpp ds/sequence/mo.hpp
        fi
        if [ -f graph/CSR.hpp ] && [ ! -e graph/csr.hpp ]; then
          ln -s CSR.hpp graph/csr.hpp
        fi

    - name: Run tests and generate docs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        YOSUPO_JUDGE_CXX: g++
        YOSUPO_JUDGE_CPLUSPLUS_COMPILER: g++
      run: oj-verify all

  pages:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install online-judge-verify-helper==5.6.0 setuptools==69.5.1

    - name: Restore case-sensitive include aliases
      run: |
        if [ -f ds/sequence/BIT.hpp ] && [ ! -e ds/sequence/bit.hpp ]; then
          ln -s BIT.hpp ds/sequence/bit.hpp
        fi
        if [ -f ds/utility/Hash.hpp ] && [ ! -e ds/utility/hash.hpp ]; then
          ln -s Hash.hpp ds/utility/hash.hpp
        fi
        if [ -f ds/sequence/Mo.hpp ] && [ ! -e ds/sequence/mo.hpp ]; then
          ln -s Mo.hpp ds/sequence/mo.hpp
        fi
        if [ -f graph/CSR.hpp ] && [ ! -e graph/csr.hpp ]; then
          ln -s CSR.hpp graph/csr.hpp
        fi

    - name: Generate documentation
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: oj-verify docs

    - name: Build Jekyll site
      uses: actions/jekyll-build-pages@v1
      with:
        source: .verify-helper/markdown
        destination: .verify-helper/markdown/_site

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: .verify-helper/markdown/_site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
